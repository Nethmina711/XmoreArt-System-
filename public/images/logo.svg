<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800;900&amp;display=swap');
      .brand-x { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 900; font-size: 72px; fill: #ED1C24; }
      .brand-more { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 800; font-size: 64px; fill: #FFFFFF; letter-spacing: -2px; }
      .brand-art { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 800; font-size: 22px; fill: #ED1C24; letter-spacing: 4px; }
      .brand-solutions { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 22px; fill: #FFFFFF; letter-spacing: 6px; }
    </style>
  </defs>

  <!-- Top Line: X MORE -->
  <g transform="translate(10, 68)">
    <text x="0" y="0" class="brand-x">X</text>
    <text x="50" y="-3" class="brand-more">MORE</text>
    
    <!-- Red Trapezoid Accent above top right -->
    <polygon points="290,-48 350,-48 332,-30 272,-30" fill="#ED1C24" />
  </g>

  <!-- Bottom Line: ART SOLUTIONS -->
  <g transform="translate(12, 105)">
    <text x="0" y="0" class="brand-art">ART</text>
    <text x="75" y="0" class="brand-solutions">SOLUTIONS</text>
    
    <!-- Underline beneath ART -->
    <line x1="0" y1="12" x2="52" y2="12" stroke="#ED1C24" stroke-width="3" stroke-linecap="round" />
    
    <!-- Underline beneath right of SOLUTIONS -->
    <line x1="295" y1="12" x2="345" y2="12" stroke="#ED1C24" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
